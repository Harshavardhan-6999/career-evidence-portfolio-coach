name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    env:
      NODE_ENV: test
      PORT: 3000
      JWT_SECRET: ci_test_jwt_secret_min_32_characters_random_string!
      COOKIE_SECRET: ci_test_cookie_secret_min_32_characters_string!
      AI_MODEL: gemini-2.5-flash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Use npm version matching local development
        run: npm install --global npm@11.19.0

      - name: Show runtime versions
      run: |
         node --version
         npm --version

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Build React Frontend Bundle
        run: npm run build:frontend

      - name: Execute Automated Test Suite
        run: npm test
